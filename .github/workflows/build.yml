name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Cache talk slide images
        uses: actions/cache@v6
        with:
          path: public/img/talks
          key: talks-images-${{ hashFiles('src/data/talks.yml') }}
          restore-keys: talks-images-
      - run: npm run build
